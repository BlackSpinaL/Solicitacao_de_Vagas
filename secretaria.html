<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secretaria — Controle de Acesso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f4f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      color: #1a1a1a;
    }
    h1 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; }
    .card {
      background: #fff;
      border: 0.5px solid #ddd;
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      margin-bottom: 1rem;
    }
    .section-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
    .section-sub { font-size: 13px; color: #666; margin-bottom: 1rem; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 5px; }
    input[type="password"] {
      width: 100%;
      padding: 9px 12px;
      border: 0.5px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      color: #1a1a1a;
      background: #fff;
      outline: none;
    }
    input:focus { border-color: #185FA5; }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      margin-top: 10px;
      font-family: inherit;
    }
    .btn-primary { background: #185FA5; color: #fff; }
    .btn-primary:hover { background: #0C447C; }
    .btn-danger { background: #A32D2D; color: #fff; }
    .btn-danger:hover { background: #791F1F; }
    .msg { font-size: 13px; margin-top: 6px; min-height: 18px; color: #A32D2D; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 500;
    }
    .badge-green { background: #EAF3DE; color: #3B6D11; }
    .badge-red { background: #FCEBEB; color: #A32D2D; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 1rem; }
    .code-box {
      font-family: monospace; font-size: 36px; font-weight: 600;
      letter-spacing: 12px; text-align: center; padding: 14px;
      background: #f4f4f0; border-radius: 8px; border: 0.5px solid #ddd;
      color: #1a1a1a; margin: 12px 0;
    }
    hr { border: none; border-top: 0.5px solid #eee; margin: 1rem 0; }
    .hist-item {
      font-size: 13px; padding: 6px 0;
      border-bottom: 0.5px solid #eee; color: #555;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .hist-item:last-child { border-bottom: none; }
    #status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .aviso {
      background: #FAEEDA; border: 0.5px solid #EF9F27; border-radius: 8px;
      padding: 10px 14px; font-size: 13px; color: #854F0B; margin-bottom: 1rem;
      max-width: 480px; width: 100%;
    }
  </style>
</head>
<body>
  <h1>Painel da Secretaria</h1>

  <div class="aviso">
    ⚠️ Esta página é exclusiva da secretaria. Não compartilhe este link com os participantes.
  </div>

  <div class="card">
    <div class="row">
      <div>
        <p class="section-title">Controle de acesso</p>
        <p class="section-sub">Gere um código para liberar o formulário</p>
      </div>
      <div>
        <span id="status-dot" style="background:#E24B4A;"></span>
        <span id="status-label" class="badge badge-red">Bloqueado</span>
      </div>
    </div>

    <label>Senha da secretaria</label>
    <input type="password" id="admin-pass" placeholder="Digite sua senha..." />
    <p class="msg" id="admin-msg"></p>
    <button class="btn btn-primary" onclick="gerarCodigo()">🔑 Gerar código de acesso</button>

    <div id="codigo-area" style="display:none;">
      <hr>
      <label>Código gerado — informe ao participante:</label>
      <div class="code-box" id="codigo-display">----</div>
      <p style="font-size:12px; color:#888; text-align:center;">Válido para um único uso</p>
      <button class="btn btn-danger" onclick="bloquearManual()">🔒 Cancelar código</button>
    </div>
  </div>

  <div class="card">
    <p class="section-title" style="margin-bottom:10px;">Histórico de acessos</p>
    <div id="historico">
      <p style="font-size:13px; color:#888;">Nenhum acesso registrado ainda.</p>
    </div>
  </div>

  <script>
    const ADMIN_SENHA = "secretaria";
    let historico = [];

    function gerarCodigo() {
      var pass = document.getElementById('admin-pass').value;
      var msg = document.getElementById('admin-msg');
      if (pass !== ADMIN_SENHA) {
        msg.textContent = "Senha incorreta.";
        return;
      }
      msg.textContent = "";
      var codigo = String(Math.floor(1000 + Math.random() * 9000));
      document.getElementById('codigo-display').textContent = codigo;
      document.getElementById('codigo-area').style.display = 'block';
      atualizarStatus(true);
      salvarCodigo(codigo);
    }

    function bloquearManual() {
      document.getElementById('codigo-area').style.display = 'none';
      document.getElementById('codigo-display').textContent = '----';
      atualizarStatus(false);
      registrarAcesso("Código cancelado manualmente");
      salvarCodigo("");
    }

    function salvarCodigo(codigo) {
      localStorage.setItem('codigo_ativo', codigo);
      registrarAcesso(codigo ? "Código gerado: " + codigo : "Código cancelado");
    }

    function atualizarStatus(liberado) {
      var dot = document.getElementById('status-dot');
      var label = document.getElementById('status-label');
      if (liberado) {
        dot.style.background = '#639922';
        label.className = 'badge badge-green';
        label.textContent = 'Código ativo';
      } else {
        dot.style.background = '#E24B4A';
        label.className = 'badge badge-red';
        label.textContent = 'Bloqueado';
      }
    }

    function registrarAcesso(texto) {
      var agora = new Date();
      var hora = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      historico.unshift({ hora: hora, texto: texto });
      var hist = document.getElementById('historico');
      hist.innerHTML = historico.slice(0, 10).map(function(h) {
        return '<div class="hist-item"><span>' + h.texto + '</span><span>' + h.hora + '</span></div>';
      }).join('');
    }
  </script>
</body>
</html>
